name: Validate development coverage

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate-development-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Microsoft Learn coverage ledger
        shell: pwsh
        run: ./tools/Test-LearnCoverage.ps1 -Root .

      - name: Validate and prepare development fixtures
        shell: pwsh
        run: ./tools/Test-DevelopmentFixtures.ps1 -Root . -PrepareDirectory "$env:RUNNER_TEMP/bcquality-development-fixtures"

      - name: Validate and prepare development-guidance fixtures
        shell: pwsh
        run: ./tools/Test-DevelopmentGuidanceFixtures.ps1 -Root . -PrepareDirectory "$env:RUNNER_TEMP/bcquality-development-guidance-fixtures"
