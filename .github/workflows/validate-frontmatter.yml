name: Validate frontmatter and structure

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml jsonschema

      - name: Run validator
        run: python .github/scripts/validate_frontmatter.py --root .

      - name: Validate knowledge response contract
        run: python .github/scripts/test_knowledge_response.py

      - name: Validate knowledge response semantics
        run: python .github/scripts/test_knowledge_response_semantics.py
