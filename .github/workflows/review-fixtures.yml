name: Validate AL review fixtures

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate-review-fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check changed-path selection regressions
        shell: pwsh
        run: ./.github/scripts/Test-ReviewChangedPaths.ps1 -Root .

      - name: Collect changed paths
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          ./.github/scripts/Get-ReviewChangedPaths.ps1 `
            -EventName $env:GITHUB_EVENT_NAME -CommitSha $env:GITHUB_SHA `
            -BaseSha $env:BASE_SHA -OutputPath "$env:RUNNER_TEMP/changed-paths.txt"

      - name: Validate review evaluation corpus
        shell: pwsh
        run: |
          ./tools/Test-ReviewFixtures.ps1 -Root . `
            -PrepareDirectory "$env:RUNNER_TEMP/bcquality-review-fixtures" `
            -ChangedPathsFile "$env:RUNNER_TEMP/changed-paths.txt" `
            -CoverageReportPath "$env:RUNNER_TEMP/review-coverage.json"
          Get-Content -LiteralPath "$env:RUNNER_TEMP/review-coverage.json"

      - name: Check context-dependent fixture regressions
        shell: pwsh
        run: ./tools/Test-ReviewFixtureContexts.ps1 -Root .
